name: Release

# Push a tag like v1.0.0 and GitHub builds the Windows exe files and publishes the release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check types and run tests
        run: |
          npm run typecheck
          npm test
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build the exe files
        run: npm run dist:win
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Focus-Timer-Setup-*.exe
            release/Focus-Timer-Portable-*.exe
      - name: Keep the files as a workflow artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: focus-timer-windows
          path: |
            release/Focus-Timer-Setup-*.exe
            release/Focus-Timer-Portable-*.exe
